# 42 tester configuration
server {
  listen 8000;
  server_name localhost;
  root ./tester/YoupiBanane;
  client_max_body_size 100m;

  location / {
    methods GET;
    root ./tester/YoupiBanane;
    cgi .bla ./tester/cgi_test;
  }

  location /post_body {
    methods POST;
    root ./tester/YoupiBanane;
    client_max_body_size 100;
  }

  location /directory/ {
    methods GET;
    root ./tester/YoupiBanane;
    index youpi.bad_extension;
    cgi .bla ./tester/cgi_test;
  }
}
