# Default webserv configuration.
# Syntax: NGINX-inspired (see decisions #2b-#6, #17 in the team notes).
# - ConfigMap key is "ip:port"; "listen 8080;" binds 0.0.0.0.
# - First server declared for an ip:port is its default server.
# - Any syntax error, unknown or duplicated directive aborts startup.

server {
    listen 8080;
    server_name localhost;
    root ./www;
    client_max_body_size 1m;
    error_page 404 /errors/404.html;
    error_page 500 502 504 /errors/50x.html;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods GET POST DELETE;
        upload_enable on;
        upload_store ./www/uploads;
    }

    location /cgi-bin {
        methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/sh;
    }

    location /old {
        redirect /;
    }
}

# Second virtual host on the same port, resolved by server_name.
server {
    listen 8080;
    server_name example.local www.example.local;
    root ./www/example;

    location / {
        methods GET;
        index index.html;
        autoindex on;
    }
}
